# In-app harness runs under Bun's native environment. The harness
# spawns a real Tug.app subprocess and drives its WKWebView through
# a Unix socket — that is the only correct test surface for UI /
# focus / selection behavior.
[test]
root = "."
# Gives the harness an end-of-run cleanup hook. `process.on("exit")`
# never fires under `bun test`; an `afterAll` registered from a preload
# does. See `_harness/test-cleanup.ts`.
preload = ["./_harness/preload.ts"]
